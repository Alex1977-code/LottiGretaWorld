<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1b1230" />
  <title>Lotti &amp; Greta</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #1b1230; overflow: hidden;
      touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; overscroll-behavior: none;
    }
    #game { position: relative; width: 100%; height: 100%; display: block; } /* Phaser zentriert die Leinwand selbst (autoCenter) */
    canvas { display: block; }
    /* Phaser-Leinwand (transparent, HUD/Steuerung) liegt über der 3D-Leinwand */
    #game > canvas { position: relative; z-index: 1; }
    #game > #gl3d { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; }
    /* Querformat-Hinweis */
    #rotate-hint {
      position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
      background: #1b1230; color: #f3e7d3; font-family: system-ui, sans-serif; text-align: center; z-index: 10;
      padding: 24px; gap: 18px;
    }
    #rotate-hint.visible { display: flex; }
    #rotate-hint .phone {
      width: 36px; height: 64px; border: 3px solid #f3b36a; border-radius: 6px;
      animation: rotate-phone 1.6s ease-in-out infinite;
    }
    #rotate-hint p { margin: 0; font-size: 18px; }
    /* Unerwartete Fehler sichtbar machen (ohne Konsole, z. B. am Handy) */
    #err-box { position: fixed; left: 8px; right: 8px; bottom: 8px; display: none; z-index: 20; background: rgba(120, 20, 30, 0.92);
      color: #fff; font: 12px/1.4 monospace; padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
    #err-box.visible { display: block; }
    #rotate-hint small { opacity: 0.7; }
    @keyframes rotate-phone { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-hint" aria-live="polite">
    <div class="phone"></div>
    <p>Bitte das Gerät ins Querformat drehen</p>
    <small>Lotti &amp; Greta spielt sich am besten quer.</small>
  </div>
  <div id="err-box" role="alert"></div>
  <script>
    // Fehler-Anzeige: erster Laufzeitfehler wird eingeblendet (Tippen blendet aus)
    (function () {
      var shown = 0;
      function show(msg) {
        if (shown++ > 2) return;
        var box = document.getElementById('err-box');
        box.textContent += (box.textContent ? '\n' : '') + 'Fehler: ' + msg;
        box.classList.add('visible');
        box.onclick = function () { box.classList.remove('visible'); };
      }
      window.addEventListener('error', function (e) { show((e.message || 'unbekannt') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
      window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && (e.reason.message || e.reason))); });
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
